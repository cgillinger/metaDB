# LOCAL DEVELOPMENT ONLY — this is not the production stack.
#
# Production on server2 runs from /mnt/docker/stacks/meta-analytics/docker-compose.yml,
# which publishes 51517:3001 (the port the Tailscale ACL grants) and bind-mounts
# /mnt/docker/appdata/meta-analytics/data. Building or `up`-ing from THIS file on the
# server recreates the container on the wrong port and silently cuts off LAN and
# Tailscale access. Deploy steps are in metaDB CLAUDE.md.
services:
  meta-analytics:
    build: .
    container_name: meta-analytics
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - ./data:/data
    environment:
      - NODE_ENV=production
      - DB_PATH=/data/analytics.db
      - HOST=0.0.0.0
      - PORT=3001
      # Uncomment and set a strong secret to protect maintenance endpoints
      # (stats, vacuum, redetect-collab). Backup remains open but rate-limited.
      # Without this variable all maintenance routes are open (LAN/Tailscale only).
      # - ADMIN_TOKEN=byt-till-ditt-eget-token
    restart: unless-stopped
