services:
  meta-analytics:
    build: .
    container_name: meta-analytics
    ports:
      # LAN-reachable, like every other service on the host. A loopback-only bind
      # was tried but there is no reverse proxy in front of this, so it just made
      # the app unreachable. Maintenance endpoints stay behind the admin token.
      - "0.0.0.0:3001:3001"
    volumes:
      - ./data:/data
    environment:
      - NODE_ENV=production
      - DB_PATH=/data/analytics.db
      - HOST=0.0.0.0
      - PORT=3001
      # Uncomment and set a strong secret to protect maintenance endpoints
      # (stats, vacuum, redetect-collab). Backup remains open but rate-limited.
      # Without this variable all maintenance routes are open (LAN/Tailscale only).
      # - ADMIN_TOKEN=byt-till-ditt-eget-token
    restart: unless-stopped
